<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文卷</title>
<!--
  文卷窗内容——自包含、零裸 import（除 ./vendor 预构建包与 ./js 模块）。

  这一版（0.4.0）的边界：
    · 阅读优先：宿主文档点开先进阅读模式，显式「编辑」才改；
    · 编辑内核 = CodeMirror 6（预构建在 ./vendor/lantai-editor.js）；
    · 左侧工作区树 = 宿主签发的工作区根只读令牌（ws.list / ws.read）；
    · 保存：自家文档直接写；宿主/工作区文档交改稿单，宿主确认后才落盘；
    · 草稿每次改动自动落盘到 ./drafts/，关窗不丢；Ctrl+S 才是「定稿」。
-->
<link rel="stylesheet" href="./css/app.css" />
</head>
<body>
<div id="app" data-theme="paper" data-view="read" data-sidebar="on" data-outline="on" data-empty="on">

  <header class="topbar">
    <button id="btn-sidebar" class="tb-btn tb-icon" type="button" title="卷库（Ctrl/Cmd+B）" aria-label="卷库">☰</button>
    <div class="brand" title="文卷">文卷<span class="brand-sub">案头</span></div>
    <div class="doc-head">
      <span class="doc-kind" id="doc-kind">未打开</span>
      <span class="doc-title" id="doc-title">从左侧选一份文档</span>
    </div>
    <div class="top-actions">
      <button id="btn-mode" class="tb-btn" type="button" title="阅读 / 编辑（Ctrl/Cmd+E）">编辑</button>
      <button id="btn-split" class="tb-btn" type="button" title="分栏预览">分栏</button>
      <button id="btn-save" class="tb-btn tb-primary" type="button" disabled title="保存（Ctrl/Cmd+S）">保存</button>
      <button id="btn-outline-toggle" class="tb-btn tb-icon" type="button" title="大纲" aria-label="大纲">纲</button>
      <button id="btn-theme" class="tb-btn tb-icon" type="button" title="夜读 / 纸白">夜</button>
      <button id="btn-palette" class="tb-btn tb-icon" type="button" title="快速打开（Ctrl/Cmd+P）">⌘P</button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" aria-label="卷库">
      <div class="side-head">
        <div class="side-tabs" role="tablist" aria-label="卷库视图">
          <button class="side-tab" type="button" data-side="workspace" role="tab" aria-selected="false">工作区</button>
          <button class="side-tab on" type="button" data-side="files" role="tab" aria-selected="true">卷库</button>
          <button class="side-tab" type="button" data-side="recent" role="tab" aria-selected="false">最近</button>
        </div>
        <button id="btn-new" class="side-new" type="button" title="新建文档" aria-label="新建文档">＋</button>
      </div>
      <div class="side-search">
        <input id="filter" type="search" placeholder="筛选文档…" autocomplete="off" spellcheck="false" aria-label="筛选文档" />
      </div>
      <div class="side-body" id="side-body"></div>
      <div class="side-foot" id="side-foot">连接中…</div>
    </aside>

    <div class="side-resizer" id="side-resizer" role="separator" aria-orientation="vertical" tabindex="0" aria-label="调整卷库宽度"></div>

    <main class="main">
      <div class="tabbar" id="tabbar" role="tablist" aria-label="打开的文档"></div>

      <div class="banner" id="banner" hidden>
        <span class="banner-text" id="banner-text"></span>
        <span class="banner-actions" id="banner-actions"></span>
      </div>

      <div class="doc-area" id="doc-area">
        <div class="editor-host" id="editor-host"></div>
        <div class="preview-host" id="preview-host" tabindex="0"></div>

        <div class="empty-host" id="empty-host">
          <div class="empty-mark">文</div>
          <h1>文卷</h1>
          <p>从左侧选一份文档，或把会话里引用到的文件点开。</p>
          <div class="empty-actions">
            <button id="empty-new" class="tb-btn tb-primary" type="button">新建一份</button>
            <button id="empty-palette" class="tb-btn" type="button">快速打开 <kbd>⌘P</kbd></button>
          </div>
          <p class="empty-hint" id="empty-hint">卷库 = 插件自己的数据地盘；工作区浏览在下一批接上。</p>
        </div>
      </div>

      <footer class="statusbar">
        <span id="status-left">未打开文档</span>
        <span class="status-right">
          <span id="status-count"></span>
          <span id="status-save" class="status-save"></span>
          <span id="status-bridge" class="status-bridge">桥：连接中</span>
        </span>
      </footer>
    </main>

    <div class="outline-resizer" id="outline-resizer" role="separator" aria-orientation="vertical" tabindex="0" aria-label="调整大纲宽度"></div>
    <aside class="outline" aria-label="大纲">
      <div class="outline-head">
        <span>大纲</span>
        <button id="btn-outline" class="tb-btn tb-icon" type="button" title="收起大纲" aria-label="收起大纲">×</button>
      </div>
      <div class="outline-body" id="outline-body"></div>
    </aside>
  </div>

  <div class="palette" id="palette" hidden>
    <div class="palette-card" role="dialog" aria-modal="true" aria-label="快速打开">
      <div class="palette-input-row">
        <span class="palette-mark" id="palette-mark">文</span>
        <input id="palette-input" type="text" placeholder="输入文件名或命令…" autocomplete="off" spellcheck="false" />
        <kbd>Esc</kbd>
      </div>
      <div class="palette-list" id="palette-list"></div>
      <div class="palette-foot" id="palette-foot">↑↓ 选择 · Enter 打开 · Esc 关闭</div>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">新建文档</h2>
      <p id="modal-desc">文档会写进文卷自己的数据地盘，不会碰工作区文件。</p>
      <div class="modal-row">
        <input id="modal-input" type="text" autocomplete="off" spellcheck="false" />
      </div>
      <p class="modal-error" id="modal-error" hidden></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="tb-btn" type="button">取消</button>
        <button id="modal-ok" class="tb-btn tb-primary" type="button">确定</button>
      </div>
    </div>
  </div>

  <div class="toast-host" id="toast-host" aria-live="polite"></div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
