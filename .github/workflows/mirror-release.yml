# ⛔ 停放中（2026-09-26）：自动镜像已关闭 —— 跨境上传/下载都传不动大文件，属结构性问题。
#    现状与恢复条件见下方 `on:` 之前的说明。清单那半（Gitee raw）已实测通过，不动。
#
# 国内更新源镜像：GitHub Release（权威源）→ Gitee（更新清单）+ GitCode（安装包）
#
# 为什么这么拆（2026-09-26 实测结论，别按直觉改）：
#   · 安装包 ~145MB(NSIS) / ~161MB(MSI) → 只能去 GitCode 发行版附件。Gitee 免费版附件
#     单文件上限 100MB，装不下；GitCode 实测有人传过 181MB 的包。
#   · 更新清单 ~3KB → 放 Gitee raw。实测 Gitee raw 对任意路径/任意文件类型都稳定 200
#     （AGENTS.md / 嵌套 docs/README.md / src-tauri/tauri.conf.json 全通），
#     且 Cache-Control: public, max-age=60 —— 发布后一分钟内全网可见。
#     GitCode raw 对新仓库是**渐进可用**的（同一路径先 403 后 200），当更新链路是赌博。
#
# 客户端侧（src-tauri/tauri.conf.json 的 plugins.updater.endpoints）：
#   [0] 本工作流产出的 Gitee 清单   ← 国内优先
#   [1] GitHub Release latest.json  ← 兜底
#
# ⚠ 四条不能违反的纪律：
#   1. **清单必须最后上传**。tauri-plugin-updater 的 check() 是
#      `for url in endpoints { ... break }`——第一个「成功解析」的端点就跳出循环。
#      清单先于安装包可见 = 客户端拿到指针却下不到包。
#   2. **清单不存在时必须保持 404**，绝不能放一个 version 0.0.0 的占位清单：
#      404（非 2XX）会让客户端继续试下一个端点 ⇒ 回落 GitHub；
#      而合法但陈旧的清单会**遮住** GitHub 兜底，用户会静默地「永远已是最新」。
#   3. **不要拿清单 url 的 basename 当文件名**。tauri-action 当前产出的 url 是
#      `https://api.github.com/repos/<o>/<r>/releases/assets/<id>`（API 资产地址，末段是
#      数字 id，不是文件名）；将来也可能变成 `/releases/download/<tag>/<name>`。
#      所以统一「按 id 优先、按解码后的文件名兜底」反查 release 资产——2026-09-26 飞行
#      前检查实测：v1.0.3 的清单就是 API 资产形态，且资产名被截断成 `_1.0.3_x64-setup.exe`
#      （`兰台` 前缀没了）。两条都说明「猜文件名」必错。
#   4. **GitCode 附件上传是「两步」，不是 multipart POST**：① `GET /releases/{tag}/upload_url
#      ?file_name=X` 拿**签名上传描述符** `{url, headers}`；② 把文件 **PUT** 到那个 url，带上
#      描述符给的 headers。官方 API 文档**缺这一页**（只有「下载附件」成文），本工作流第一版
#      按 Gitee 的形状写成 `POST /attach_files -F file=@...`，2026-09-26 实跑必失败——症状是
#      GitCode 上发行版建出来了（还带 4 个自动生成的源码包）、**附件一个都没有**，而 Gitee
#      清单始终 404。机制由同构项目 Sakura 的 tools/release/gitcode_mirror.py 取证。
#
# 镜像范围：清单里所有 `windows-*` 条目引用到的**全部**资产都要镜像（当前 = NSIS setup
#   + MSI，两枚包对应三个条目）。只镜像 NSIS 会让「当初用 MSI 装的用户」永远回落 GitHub。
#
# 前置（仓库级配置；缺项 ⇒ 判红并点名缺什么，绝不静默跳过）：
#   **清单出口（必配）**
#     vars.GITEE_REPOSITORY        <owner>/<repo>，如 jingwen-bing/lantai-agent
#     secrets.GITEE_ACCESS_TOKEN   对 Gitee 仓库有代码推送权限的私人令牌
#   **安装包出口（二选一）**
#     A. S3 兼容存储 —— **推荐**。美国 runner 走正常国际链路，几分钟传完，不跨境。
#        vars.S3_ENDPOINT          R2：https://<acct>.r2.cloudflarestorage.com
#                                  腾讯云 COS 香港：https://cos.ap-hongkong.myqcloud.com
#        vars.S3_BUCKET            桶名
#        vars.S3_PUBLIC_BASE       桶的公开访问前缀（如 https://pub-xxxx.r2.dev）
#        vars.S3_REGION（可选）     默认 auto
#        vars.S3_PREFIX（可选）     对象前缀，默认 lantai
#        secrets.S3_ACCESS_KEY_ID / secrets.S3_SECRET_ACCESS_KEY
#     B. GitCode 发行版附件 —— 0 元兜底，但**跨境上传实测 <89KB/s**，一次发版约一小时：
#        vars.GITCODE_REPOSITORY   <owner>/<repo>，如 gcw_aU7Q6cqH/LantaiAgent
#        secrets.GITCODE_ACCESS_TOKEN
#
# 失败语义：本工作流失败**不影响** GitHub 上的正式发布（权威源）。
#   全有或全无：任一资产上传/读回校验失败 ⇒ 不推清单（客户端回落 GitHub，回到现状），
#   但已在 GitCode 上的附件保留；重跑是幂等的（同名附件跳过上传，读回比对照做）。
name: Mirror Release

on:
  # ⛔ 自动镜像已停放（2026-09-26）——原因与恢复条件见下方说明；恢复只需取消注释 workflow_run。
  #
  # workflow_run:
  #   workflows: ['Release']
  #   types: [completed]
  #
  # ▼ 停放原因（结构性，不是参数问题，别再靠调超时/砍回读去救）：
  #   · GitHub 的美国 runner → 国内 GitCode 传 161MB，实测 < 89KB/s，撞满我设的
  #     `--max-time 1800`（运行时长 30m23s 与该上限精确吻合）。
  #   · 反向也不行：本机实测连不上 GitHub 的 release 资产域（HTTP 000 / SSL 连接失败），
  #     所以「下载到本地再上传」这条补救路同样不通。
  #   · 结论：**两个跨境方向都传不动大文件**。只要安装包落在国内主机，从美国 CI 上传就
  #     必然跨境慢传（换 Gitee 也一样）。
  #
  # ▼ 恢复条件：先选定安装包存放位置，三选一（详见对话/后续 ADR）：
  #   A. 阿里云 OSS 国内 bucket + 传输加速（上传走加速通道、下载国内最快，有流量费）
  #   B. Cloudflare R2（免费；上传快、国内实测 2.4MB/s；r2.dev 默认域名有速率限制）
  #   C. 安装包瘦身 86MB（把 model.onnx 移出 bundle.resources 改首用下载）后挂 Gitee
  #   选定后：取消注释上面的 workflow_run，并把「上传全部资产并逐字节读回校验」那一步
  #   换成对应存储的客户端（清单仍是 Gitee raw，那半已实测通过，不动）。
  #
  # ▼ 停放期间的客户端行为：Gitee 清单不存在（404）⇒ updater 继续试下一个端点 ⇒ 回落
  #   GitHub —— 与本次改动之前完全一致，**没有任何用户受影响**。
  #
  # ▼ 手动触发保留：可用于试通新的存储通道（手动跑才会执行，不会白烧 CI 时间）。
  workflow_dispatch:
    inputs:
      tag:
        description: '要镜像的 tag（如 v1.0.3）；留空 = 最新 release'
        required: false
        type: string
      verify_bytes:
        description: '对大文件也做全量逐字节读回比对（耗时翻倍，用于一次性审计）'
        required: false
        type: boolean
        default: false

concurrency:
  group: mirror-release
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_ACCESS_TOKEN }}
      GITEE_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      GITCODE_REPO: ${{ vars.GITCODE_REPOSITORY }}
      GITEE_REPO: ${{ vars.GITEE_REPOSITORY }}
      INPUT_TAG: ${{ github.event.inputs.tag }}
      RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
      VERIFY_BYTES: ${{ github.event.inputs.verify_bytes }}
      # 安装包出口 A（推荐）：S3 兼容存储。三个 var 配齐即走 S3，否则回落出口 B。
      # R2 / 腾讯云 COS 香港 / AWS S3 都是同一套 S3 协议，只换 endpoint 与密钥。
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_PUBLIC_BASE: ${{ vars.S3_PUBLIC_BASE }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_PREFIX: ${{ vars.S3_PREFIX }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: 解析 tag 与前置检查
        id: resolve
        run: |
          set -euo pipefail
          # 本工作流的唯一职责就是镜像；配不全 = 没干活 = 失败。**不许静默跳过**：
          # 2026-09-26 实测教训——原实现做成 ::notice:: + skip，于是「Variables 页签漏配」
          # 表现为一次全绿的空跑，白耗一轮往返（CONVENTIONS 的「错误不静默」同样约束 CI）。
          #
          # 出口两档（见文件头「前置」）：
          #   A. S3 兼容存储（推荐）：GITEE_* + S3_* 即可
          #   B. GitCode 附件（兜底）：额外要 GITCODE_REPOSITORY + 令牌
          MODE=s3
          if [ -z "${S3_ENDPOINT}" ] || [ -z "${S3_BUCKET}" ] || [ -z "${S3_PUBLIC_BASE}" ]; then
            MODE=gitcode
          fi

          MISSING=""
          [ -z "${GITEE_REPO}" ] && MISSING="${MISSING} GITEE_REPOSITORY"
          [ -z "${GITEE_TOKEN}" ] && MISSING="${MISSING} GITEE_ACCESS_TOKEN(secret)"
          if [ "$MODE" = "gitcode" ]; then
            [ -z "${GITCODE_REPO}" ] && MISSING="${MISSING} GITCODE_REPOSITORY"
            [ -z "${GITCODE_TOKEN}" ] && MISSING="${MISSING} GITCODE_ACCESS_TOKEN(secret)"
          else
            [ -z "${S3_ACCESS_KEY_ID}" ] && MISSING="${MISSING} S3_ACCESS_KEY_ID(secret)"
            [ -z "${S3_SECRET_ACCESS_KEY}" ] && MISSING="${MISSING} S3_SECRET_ACCESS_KEY(secret)"
          fi

          if [ -n "${MISSING}" ]; then
            echo "::error::国内镜像未配置完整（出口 ${MODE}），缺少：${MISSING}"
            {
              echo "### 国内镜像未配置完整，本轮没有做任何事"
              echo ""
              echo "上传出口：\`${MODE}\`；缺少：\`${MISSING# }\`"
              echo ""
              echo "配置入口：**Settings → Secrets and variables → Actions**"
              echo "（⚠ 变量在 **Variables** 页签、密钥在 **Secrets** 页签——\`vars.*\` 读不到"
              echo "Secrets；两者都必须是 **Repository** 级，Environment 级的读不到）"
              echo ""
              echo "两条路选一条："
              echo ""
              echo "**A. S3 兼容存储（推荐；不跨境，几分钟传完）**"
              echo ""
              echo "| 类型 | Name | 说明 |"
              echo "|---|---|---|"
              echo "| Variables | \`S3_ENDPOINT\` | R2：\`https://<acct>.r2.cloudflarestorage.com\`；腾讯云 COS 香港：\`https://cos.ap-hongkong.myqcloud.com\` |"
              echo "| Variables | \`S3_BUCKET\` | 桶名 |"
              echo "| Variables | \`S3_PUBLIC_BASE\` | 桶的公开访问前缀，如 \`https://pub-xxxx.r2.dev\` |"
              echo "| Variables | \`S3_REGION\`（可选） | 默认 \`auto\` |"
              echo "| Variables | \`S3_PREFIX\`（可选） | 对象前缀，默认 \`lantai\` |"
              echo "| Secrets | \`S3_ACCESS_KEY_ID\` / \`S3_SECRET_ACCESS_KEY\` | 该桶的读写密钥 |"
              echo "| Variables | \`GITEE_REPOSITORY\` | \`jingwen-bing/lantai-agent\` |"
              echo "| Secrets | \`GITEE_ACCESS_TOKEN\` | Gitee 私人令牌（推更新清单用） |"
              echo ""
              echo "**B. 回落 GitCode 附件（0 元，但跨境上传约一小时）**：再补 \`GITCODE_REPOSITORY\`"
              echo "（\`gcw_aU7Q6cqH/LantaiAgent\`）与 \`GITCODE_ACCESS_TOKEN\`。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "上传出口：${MODE}"

          TAG="${INPUT_TAG:-${RUN_BRANCH:-}}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi

          # 清单地址必须与客户端写死的首个端点一致，否则镜像白做
          ENDPOINT="$(jq -r '.plugins.updater.endpoints[0]' src-tauri/tauri.conf.json)"
          EXPECTED="https://gitee.com/${GITEE_REPO}/raw/updater-manifest/latest.json"
          if [ "$ENDPOINT" != "$EXPECTED" ]; then
            echo "::error::tauri.conf.json 的首个更新端点与镜像目标不一致"
            echo "  端点: $ENDPOINT"
            echo "  期望: $EXPECTED"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "manifest=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "解析结果：tag=$TAG"
          echo "清单地址：$ENDPOINT"

      - name: 从 GitHub Release 取件（清单 + 它引用的全部资产）
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern latest.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > dist/release.json

          # 纪律 3：按「资产 id 优先、解码后的文件名兜底」反查，绝不拿 url 的 basename 当文件名
          python3 - <<'PY' > dist/plan.tsv
          import json, os, sys, urllib.parse
          m = json.load(open('dist/latest.json', encoding='utf-8'))
          rel = json.load(open('dist/release.json', encoding='utf-8'))
          assets = rel.get('assets', [])
          by_id = {str(a['id']): a for a in assets}
          by_name = {a['name']: a for a in assets}
          rows = []
          for key, val in m.get('platforms', {}).items():
              if not key.startswith('windows'):
                  continue
              url = val.get('url', '')
              asset = None
              if '/releases/assets/' in url:
                  asset = by_id.get(url.rstrip('/').rsplit('/', 1)[-1])
              if asset is None:
                  asset = by_name.get(urllib.parse.unquote(os.path.basename(url)))
              if asset is None:
                  sys.stderr.write(f'::warning::清单条目 {key} 的 url 定位不到 release 资产：{url}\n')
                  continue
              rows.append((key, url, str(asset['id']), asset['name']))
          for r in rows:
              print('\t'.join(r))
          sys.stderr.write(f'可定位的 windows 条目：{len(rows)}\n')
          PY

          if [ ! -s dist/plan.tsv ]; then
            echo "::error::清单里没有任何可定位的 windows 条目"
            cat dist/latest.json
            exit 1
          fi
          echo "=== 待镜像条目（条目/原始url/资产id/资产名） ==="
          cat dist/plan.tsv

          # 同一个资产可能被多个条目引用（windows-x86_64 与 -nsis 指向同一枚 setup.exe）
          awk -F'\t' '{print $3"\t"$4}' dist/plan.tsv | sort -u > dist/assets.tsv
          echo "=== 去重后的资产 ==="
          cat dist/assets.tsv

          VER="$(jq -r .version dist/latest.json)"
          : > dist/files.tsv
          while IFS=$'\t' read -r AID ANAME; do
            [ -z "${AID:-}" ] && continue
            SIGID="$(jq -r --arg n "${ANAME}.sig" '.assets[]? | select(.name==$n) | .id' dist/release.json)"
            if [ -z "$SIGID" ] || [ "$SIGID" = "null" ]; then
              echo "::error::资产 ${ANAME} 没有配套的 .sig —— 签名是更新校验的必需项，不能镜像"
              exit 1
            fi
            echo "下载 id=$AID  name=$ANAME"
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$AID" \
              -H 'Accept: application/octet-stream' > "dist/$ANAME"
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$SIGID" \
              -H 'Accept: application/octet-stream' > "dist/$ANAME.sig"
            # 上传到 GitCode 时改用 ASCII 名：附件名会进 URL 路径，中文名要百分号编码，
            # 国内平台对非 ASCII 路径的处理不一定稳。字节不变 ⇒ 签名依然有效。
            case "$ANAME" in
              *.msi) ASCII="Lantai_${VER}_x64_zh-CN.msi" ;;
              *)     ASCII="Lantai_${VER}_x64-setup.exe" ;;
            esac
            mv "dist/$ANAME" "dist/$ASCII"
            mv "dist/$ANAME.sig" "dist/$ASCII.sig"
            printf '%s\t%s\t%s\n' "$AID" "$ASCII" "$ANAME" >> dist/files.tsv
          done < dist/assets.tsv
          echo "version=$VER" >> "$GITHUB_ENV"
          echo "=== 本地待传文件 ==="
          ls -l dist
          cat dist/files.tsv

      - name: 建（或复用）GitCode 发行版
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          API="https://api.gitcode.com/api/v5/repos/${GITCODE_REPO}"
          auth=(-H "PRIVATE-TOKEN: ${GITCODE_TOKEN}")

          # 一律按 **tag** 寻址（不用 release id）：GitCode 的 PATCH /releases/{tag} 与
          # upload_url 都以 tag 为路径参数 ⇒ 省掉一次 id 解析 = 少一个失败面。
          # 用 -w '%{http_code}' + 兜底 '000'，**不要**用 `|| echo 000`——curl 在 HTTP 错误时
          # 仍会写出状态码，两者叠加会得到 "403\n000" 这种非数字，后面整数比较直接炸。
          rel_code() {
            curl -sS "${auth[@]}" "$API/releases/tags/$TAG" -o /tmp/rel.json -w '%{http_code}' 2>/dev/null || true
          }
          CODE="$(rel_code)"
          CODE="${CODE:-000}"
          if [ "$CODE" = "200" ]; then
            echo "GitCode 上已有 $TAG 的发行版，复用"
          else
            echo "GitCode 上还没有 $TAG 的发行版（HTTP $CODE），创建（先置 pre，清单推完再提 latest）"
            jq -n --arg t "$TAG" \
              '{tag_name:$t, name:$t, body:("镜像自 GitHub Release "+$t+"（字节与签名原样，未重新构建）"), release_status:"pre"}' \
              > /tmp/create.json
            curl -sS "${auth[@]}" -H 'Content-Type: application/json' -X POST \
              --data @/tmp/create.json "$API/releases" -o /tmp/created.json \
              -w 'create_http=%{http_code}\n' || true
            head -c 400 /tmp/created.json 2>/dev/null; echo
            CODE="$(rel_code)"
            CODE="${CODE:-000}"
            if [ "$CODE" != "200" ]; then
              echo "::error::创建后仍读不到 $TAG 的发行版（HTTP $CODE）"
              head -c 400 /tmp/rel.json 2>/dev/null; echo
              exit 1
            fi
          fi

      - name: 上传全部资产并读回校验（出口由配置选择）
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          : > dist/uploaded.tsv

          # 两个出口，由仓库配置选择（见文件头「前置」）：
          #   · S3 兼容存储（Cloudflare R2 / 腾讯云 COS 香港 / AWS S3）—— **推荐**：
          #     美国 runner 走的是正常国际链路，几分钟传完，不再跨境撞墙。
          #   · GitCode 发行版附件 —— 兜底：0 元，但跨境上传实测 <89KB/s，一次发版
          #     要在后台跑约一小时，且链路不稳（2026-09-26 实测撞满 30 分钟上限）。
          # 下游（清单改写 / 推 Gitee）只认 dist/uploaded.tsv，与出口无关。
          if [ -n "${S3_ENDPOINT}" ] && [ -n "${S3_BUCKET}" ] && [ -n "${S3_PUBLIC_BASE}" ]; then
            MODE=s3
          else
            MODE=gitcode
          fi
          echo "上传出口：${MODE}"

          if [ "$MODE" = "gitcode" ]; then
            API="https://api.gitcode.com/api/v5/repos/${GITCODE_REPO}"
            auth=(-H "PRIVATE-TOKEN: ${GITCODE_TOKEN}")
            # 已存在的附件名单（幂等：重跑不重复上传）
            curl -sS "${auth[@]}" "$API/releases/tags/$TAG" -o /tmp/rel.json
            jq -r '.assets[]?.name' /tmp/rel.json > /tmp/have.txt 2>/dev/null || true
            echo "=== GitCode 上已有的附件 ==="
            cat /tmp/have.txt

            # GitCode 的附件上传是**两步**（官方文档缺这一页；2026-09-26 由同构项目
            # Sakura 的实现取证）：① GET /releases/{tag}/upload_url?file_name=X 拿
            # **签名上传描述符** {url, headers}；② 把文件 **PUT** 到那个 url，带上描述符
            # 给的 headers。**不是** multipart POST 到 /attach_files —— 那样写实测必失败
            # （GitCode 上会出现发行版、附件却一个没有）。
            descriptor() {
              curl -sS "${auth[@]}" --get --data-urlencode "file_name=$1" \
                "$API/releases/$TAG/upload_url" 2>/dev/null || true
            }
            descriptor_qs() {
              curl -sS --get --data-urlencode "file_name=$1" \
                --data-urlencode "access_token=${GITCODE_TOKEN}" \
                "$API/releases/$TAG/upload_url" 2>/dev/null || true
            }
          else
            export AWS_ACCESS_KEY_ID="${S3_ACCESS_KEY_ID}"
            export AWS_SECRET_ACCESS_KEY="${S3_SECRET_ACCESS_KEY}"
            export AWS_DEFAULT_REGION="${S3_REGION:-auto}"
            export AWS_EC2_METADATA_DISABLED=true
            KEY_PREFIX="${S3_PREFIX:-lantai}/${TAG}"
          fi

          while IFS=$'\t' read -r AID ASCII ORIG; do
            LOCAL="dist/$ASCII"
            LSIZE="$(stat -c%s "$LOCAL")"

            if [ "$MODE" = "s3" ]; then
              KEY="${KEY_PREFIX}/${ASCII}"
              echo "上传 ${ASCII}（${LSIZE} 字节）→ s3://${S3_BUCKET}/${KEY}"
              if ! aws s3 cp "$LOCAL" "s3://${S3_BUCKET}/${KEY}" \
                     --endpoint-url "${S3_ENDPOINT}" --only-show-errors; then
                echo "::error::S3 上传失败：${ASCII}（endpoint ${S3_ENDPOINT}）"
                exit 1
              fi
              URL="${S3_PUBLIC_BASE%/}/${KEY}"
            else
              if grep -qxF "$ASCII" /tmp/have.txt; then
                echo "附件 ${ASCII} 已存在，跳过上传"
              else
                DESC="$(descriptor "$ASCII")"
                UP_URL="$(jq -r '.url // empty' <<<"$DESC" 2>/dev/null || true)"
                if [ -z "$UP_URL" ]; then
                  echo "PRIVATE-TOKEN 拿不到描述符，改用 access_token query 重试"
                  DESC="$(descriptor_qs "$ASCII")"
                  UP_URL="$(jq -r '.url // empty' <<<"$DESC" 2>/dev/null || true)"
                fi
                if [ -z "$UP_URL" ]; then
                  echo "::error::拿不到上传描述符（$ASCII）—— API 原样返回："
                  printf '%s\n' "$DESC" | head -c 600; echo
                  exit 1
                fi
                HDRS=()
                while IFS= read -r h; do [ -n "$h" ] && HDRS+=(-H "$h"); done \
                  < <(jq -r '.headers // {} | to_entries[] | "\(.key): \(.value)"' <<<"$DESC")
                echo "上传 ${ASCII}（${LSIZE} 字节，签名头 ${#HDRS[@]} 个）—— 每 30s 打一次心跳"
                # curl 放后台、前台打心跳（GitHub 的 runner 在美国，跨境上传实测速度波动
                # 极大：最快 8.5MB/s、最慢 <89KB/s ⇒ 单文件几十秒到半小时，日志静默那么久
                # 会被误判成卡死）。⚠ 判完成用**标记文件**而非 kill -0：子进程结束后变
                # 僵尸，kill -0 照样返回成功，循环永不退出。
                rm -f /tmp/up.done /tmp/up.metrics
                (
                  curl -sS --fail-with-body --upload-file "$LOCAL" \
                    --connect-timeout 30 --max-time 3600 \
                    "${HDRS[@]}" "$UP_URL" -o /tmp/up.json \
                    -w '%{http_code} %{size_upload} %{speed_upload} %{time_total}' \
                    > /tmp/up.metrics 2>/dev/null
                  : > /tmp/up.done
                ) &
                SECS=0
                while [ ! -f /tmp/up.done ]; do
                  sleep 30
                  SECS=$((SECS + 30))
                  [ -f /tmp/up.done ] || echo "  …上传中：已 ${SECS}s / ${LSIZE} 字节"
                done
                wait || true
                CODE=""; SENT=""; SPEED=""; TAKEN=""
                read -r CODE SENT SPEED TAKEN < /tmp/up.metrics || true
                CODE="${CODE:-000}"
                echo "上传结果：HTTP ${CODE}；已发送 ${SENT:-?} 字节；均速 ${SPEED:-?} B/s；耗时 ${TAKEN:-?} s"
                if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
                  head -c 600 /tmp/up.json 2>/dev/null; echo
                  echo "::error::GitCode 附件上传失败：${ASCII}（HTTP $CODE）"
                  exit 1
                fi
                # 附件是**异步可见**的：轮询到它出现在 release 资产列表里再往下走
                for _ in $(seq 1 30); do
                  curl -sS "${auth[@]}" "$API/releases/tags/$TAG" -o /tmp/rel2.json
                  if jq -e --arg n "$ASCII" '[.assets[]?.name] | index($n)' /tmp/rel2.json >/dev/null 2>&1; then
                    echo "  附件已可见：${ASCII}"
                    break
                  fi
                  sleep 2
                done
              fi
              URL="https://api.gitcode.com/api/v5/repos/${GITCODE_REPO}/releases/${TAG}/attach_files/${ASCII}/download"
            fi

            # —— 公开可达性 + 两档内容校验（出口无关）——
            # 校验分两档，因为跨境/外网流量是这一跑最贵的资源：小文件（≤1MB）或手动勾了
            # verify_bytes ⇒ 全量拉回逐字节比对；大文件 ⇒ ranged GET 取首 1KB 对位比对，
            # 代价≈0，同时仍然证明了客户端真正依赖的性质（公开可下载、无需凭据）。
            # 为什么敢省掉大文件的全量比对：**终局校验在客户端**——Tauri 下载后要用内嵌
            # pubkey 验 minisign 签名，内容差一个字节就拒绝安装。
            if [ "${VERIFY_BYTES:-false}" = "true" ] || [ "$LSIZE" -le 1048576 ]; then
              if ! curl -sfL --retry 3 --retry-delay 5 \
                   -H 'User-Agent: tauri-plugin-updater/2.10.1' "$URL" -o /tmp/back.bin; then
                echo "::error::公开地址取不到附件：$URL"
                exit 1
              fi
              if ! cmp -s "$LOCAL" /tmp/back.bin; then
                echo "::error::读回内容与本地不一致：${ASCII}（$(stat -c%s /tmp/back.bin) vs ${LSIZE} 字节）"
                exit 1
              fi
              echo "公开读回逐字节一致：${ASCII}  ${LSIZE} 字节"
            else
              PCODE="$(curl -sS -L --max-time 120 -r 0-1023 -o /tmp/probe.bin -w '%{http_code}' \
                        -H 'User-Agent: tauri-plugin-updater/2.10.1' "$URL" 2>/dev/null)" || true
              PCODE="${PCODE:-000}"
              echo "大文件探针：HTTP ${PCODE}，取回 $(stat -c%s /tmp/probe.bin 2>/dev/null || echo 0) 字节"
              if [ "$PCODE" -lt 200 ] || [ "$PCODE" -ge 400 ]; then
                echo "::error::公开地址不可达（HTTP ${PCODE}）：$URL"
                exit 1
              fi
              if [ "$PCODE" = "206" ]; then
                head -c 1024 "$LOCAL" > /tmp/probe.local
                if ! cmp -s /tmp/probe.local /tmp/probe.bin; then
                  echo "::error::首 1KB 与本地不一致：${ASCII}"
                  exit 1
                fi
                echo "公开可达，首 1KB 逐字节一致（${LSIZE} 字节的大包按设计不做全量比对）"
              else
                echo "::warning::${ASCII} 只能确认公开可达（HTTP ${PCODE}），未做内容比对"
              fi
            fi
            printf '%s\t%s\t%s\n' "$AID" "$ASCII" "$URL" >> dist/uploaded.tsv
          done < dist/files.tsv
          echo "=== 已镜像资产 ==="
          cat dist/uploaded.tsv
      - name: 生成镜像清单（只改 url，保住签名）
        run: |
          set -euo pipefail
          # 按「原 url → GitCode url」映射改写（而不是按文件名匹配）。version / notes /
          # pub_date / signature 一律原样：签名覆盖的是安装包字节，换 URL 不影响校验；
          # 重新签名反而会让老客户端校验失败。
          python3 - <<'PY'
          import json, sys
          up = {}
          for line in open('dist/uploaded.tsv', encoding='utf-8'):
              aid, ascii_name, url = line.rstrip('\n').split('\t')
              up[aid] = url
          plan = {}
          for line in open('dist/plan.tsv', encoding='utf-8'):
              key, orig, aid, name = line.rstrip('\n').split('\t')
              plan.setdefault(aid, []).append((key, orig))
          m = json.load(open('dist/latest.json', encoding='utf-8'))
          rewritten, missed = 0, []
          for aid, keys in plan.items():
              new_url = up.get(aid)
              for key, orig in keys:
                  if new_url is None:
                      missed.append(f'{key}（资产 {aid} 未镜像）')
                      continue
                  entry = m['platforms'].get(key)
                  if entry is None or entry.get('url') != orig:
                      missed.append(f'{key}（清单 url 与取件时不符）')
                      continue
                  entry['url'] = new_url
                  rewritten += 1
          if rewritten == 0:
              sys.exit('清单里没有任何条目被改写 —— 拒绝推出一个只指向 GitHub 的镜像清单')
          if missed:
              print('::warning::以下条目未改写（仍指向 GitHub）：' + '、'.join(missed), file=sys.stderr)
          json.dump(m, open('dist/latest.mirror.json', 'w', encoding='utf-8'),
                    ensure_ascii=False, indent=2)
          print(f'改写 {rewritten} 条 windows 条目，未改写 {len(missed)} 条')
          PY
          cat dist/latest.mirror.json

      - name: 推清单到 Gitee（updater-manifest 分支）
        run: |
          set -euo pipefail
          GITEE_USER="${GITEE_REPO%%/*}"
          mkdir -p manifest && cd manifest
          cp ../dist/latest.mirror.json latest.json
          git init -q -b updater-manifest
          git add latest.json
          git -c user.email="mirror@users.noreply.github.com" \
              -c user.name="lantai-mirror" \
              -c commit.gpgsign=false \
              commit -q -m "chore(updater): 镜像 ${version}"
          # 单文件分支：每次强推一个孤儿 commit，不留历史噪声；不碰 main/master。
          git push --force \
            "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" \
            HEAD:refs/heads/updater-manifest

      - name: 验清单已公开可见且全部条目指向 GitCode（无凭据）
        env:
          MANIFEST: ${{ steps.resolve.outputs.manifest }}
        run: |
          set -euo pipefail
          # Gitee raw 有 60s CDN 缓存 —— 清单不是瞬时可见，轮询等它。
          for i in $(seq 1 20); do
            if curl -sfL -H 'User-Agent: tauri-plugin-updater/2.10.1' \
                 -H 'Accept: application/json' "$MANIFEST" -o /tmp/m.json; then
              V="$(jq -r .version /tmp/m.json 2>/dev/null || echo '')"
              BAD="$(jq -r '[.platforms[] | select(.url | test("api\\.gitcode\\.com") | not)] | length' /tmp/m.json 2>/dev/null || echo 'x')"
              if [ "$V" = "$version" ] && [ "$BAD" = "0" ]; then
                echo "清单已公开可见、版本正确、全部条目指向 GitCode（第 ${i} 次探测）"
                exit 0
              fi
              echo "第 ${i} 次：version=$V，未指向 GitCode 的条目数=$BAD —— 等 CDN"
            else
              echo "第 ${i} 次：清单还取不到 —— 等 CDN"
            fi
            sleep 15
          done
          echo "::error::清单 5 分钟内未就绪；附件已上传，但客户端暂时读不到新清单"
          exit 1

      - name: 提为正式发行版
        continue-on-error: true
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          API="https://api.gitcode.com/api/v5/repos/${GITCODE_REPO}"
          # 纯展示面（附件下载不依赖它）—— 失败只告警，不判红整轮。
          # 按 tag 寻址，且把 name/body 一并带上（GitCode 的 PATCH 要求它们在场）。
          jq -n --arg t "$TAG" \
            '{name:$t, body:("镜像自 GitHub Release "+$t+"（字节与签名原样，未重新构建）"), release_status:"latest"}' \
            > /tmp/patch.json
          curl -sS -H "PRIVATE-TOKEN: ${GITCODE_TOKEN}" -H 'Content-Type: application/json' \
            -X PATCH --data @/tmp/patch.json "$API/releases/$TAG" \
            -o /tmp/promote.json -w 'promote_http=%{http_code}\n' || true
          head -c 200 /tmp/promote.json 2>/dev/null; echo

      - name: 汇总
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          MANIFEST: ${{ steps.resolve.outputs.manifest }}
        run: |
          {
            echo "## 国内更新源镜像完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| tag | \`${TAG}\` |"
            echo "| 版本 | \`${version}\` |"
            echo "| 更新清单（Gitee raw） | \`${MANIFEST}\` |"
            echo ""
            echo "已镜像资产："
            echo ""
            echo '```'
            cat dist/uploaded.tsv
            echo '```'
            echo ""
            echo "客户端 \`plugins.updater.endpoints\` 首位即上面的清单地址；GitHub 那份保持兜底。"
          } >> "$GITHUB_STEP_SUMMARY"
