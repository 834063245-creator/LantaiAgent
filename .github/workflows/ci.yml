# CI — 只做一件事：前端能编译（= 本仓记录在册的前端门禁）。
#
# ── 为什么只剩这一个 job（2026-09-22 重写）──────────────────────────────────────
# CLAUDE.md 把 `ci.yml` 列在「不改的」清单里；本次重写**由用户明确授权**
# （原话「搞一个必过的最简 CI」）。规则本身仍然有效——后续再动仍须先问。
#
# 旧的四条 job 里，三条注定不可靠，且**失败与代码质量无关**（推上去必红）：
#   · desktop —— tauri 的 build script 对 bundle.resources 做**编译期存在性校验**
#     （`cargo check` 即触发），而它依赖的东西 CI 里没人创建：
#       ① `../src-ui/dist-plugins` 由 src-ui 的 `npm run build` 生成，该 job 却只跑
#          `npx vite build` ⇒ 实测报 `resource path ..\src-ui\dist-plugins doesn't exist`；
#       ② 随包件 `bin/officecli.exe`（office 域工具后端，32 MB）同理，CI 不取件；
#       ③ 90 MB 的 `model.onnx` 要现场从 HuggingFace 拉——外网依赖，随时可挂。
#     修它要么换 job 用的命令、要么换资源注入通道，都属工程改动，不在本次范围。
#   · engine 矩阵（ubuntu + windows × `cargo test --release` 全 workspace）——重，
#     要装系统 C++ 工具链，失败模式与前端无关。
#   · dsh-bundle —— 依赖 npm 安装 + 打包校验，价值面窄。
#
# 保留的判据 = **仓库自己的前端门禁**（CLAUDE.md 门禁表：`cd src-ui && npm run build`，
# 即 esbuild 产物域 + `tsc --noEmit` + `vite build`）。三件全在仓库内、无外网依赖、
# 结果确定；已在本地实测通过（2026-09-22：`npm run build` exit 0）。
#
# 环境前提（已核）：`src-ui/package-lock.json` 被 git 跟踪且未被 ignore（`npm ci` 可用）；
# `build-builtin-plugins.mjs` 走的 esbuild 是 lock 内的具名条目（`node_modules/esbuild`），
# 按显式相对路径导入；仓库无 `target/` 时其镜像步骤优雅降级为空操作。
#
# 要加回真实门禁（vitest / cargo test / convergence）时，**先确认它在 CI 环境真能过**——
# 别把「跑不完 / 拉不到外网 / 缺资源」这类失败重新引进来。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: src-ui
      - run: npm run build
        working-directory: src-ui
        env:
          NODE_OPTIONS: --max-old-space-size=4096
